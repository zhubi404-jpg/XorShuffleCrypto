[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encrypt-tool-zhubi404-jpg"
version = "1.0.0"
description = "Offset-based encryption tool with HKDF and multiple PRNGs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "zhubi404-jpg", email = "323840632+zhubi404-jpg@users.noreply.github.com"}
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
encrypt-tool = "gui:main"

[tool.setuptools]
py-modules = ["core", "gui"]
